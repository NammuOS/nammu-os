services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nammu-os-app
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nammu-network

  postgres:
    image: postgres:16-alpine
    container_name: nammu-os-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nammu_secret_password
      POSTGRES_DB: nammu_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nammu_os']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nammu-network

  redis:
    image: redis:7-alpine
    container_name: nammu-os-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nammu-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nammu-network:
    driver: bridge
