apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nammu-os-hpa
  namespace: nammu-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nammu-os-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
